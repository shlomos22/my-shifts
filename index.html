<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח משמרות</title>
	<link rel="manifest" href="manifest.json">
	
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-top: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; background: #e4e6eb; border-radius: 10px; font-weight: bold; }
        .tab-btn.active { background: #1a73e8; color: white; }
        .view { display: none; }
        .view.active { display: block; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        select, input[type="date"], input[type="month"] { font-family: inherit; font-size: 16px; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        .shift-options { display: flex; flex-direction: column; gap: 8px; background: #f9f9f9; padding: 15px; border-radius: 15px; }
        .option { display: flex; align-items: center; gap: 10px; font-size: 18px; cursor: pointer; }
        .option input { width: 22px; height: 22px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .save-btn { background: #28a745; color: white; }
        .pull-btn { background: #6c757d; color: white; font-size: 14px; padding: 10px; }
        .all-tech-btn { background: #007bff; color: white; font-size: 15px; padding: 12px; margin-top: 10px; }
        .status-bar { font-size: 13px; color: #1a73e8; margin-bottom: 10px; min-height: 18px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .day-header { font-weight: bold; font-size: 12px; color: #777; }
        .day-cell { padding: 4px 2px; border: 1px solid #eee; border-radius: 8px; background: #fff; min-height: 70px; display: flex; flex-direction: column; align-items: center; }
        .day-num { font-weight: bold; font-size: 13px; margin-bottom: 3px; }
        .shift-tag { font-size: 9px; padding: 2px 3px; border-radius: 4px; margin: 1px 0; width: 95%; color: white; text-align: center; font-weight: bold; }
        .tag-יום { background-color: #ff9800; }
        .tag-לילה { background-color: #673ab7; }
        .tag-חופש { background-color: #e91e63; }
        .tag-מחלה { background-color: #4caf50; }
        .today { border: 2px solid #1a73e8; background-color: #f0f7ff; }
		.day-cell:hover { background-color: #f8f9fa; border-color: #1a73e8; }
		.tag-note { background-color: #607d8b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; }

        /* עיצוב המשימות היומיות והחלונית הצפה */
        .user-tasks-card { background: #eef4ff; border: 1px solid #b6d4fe; border-radius: 12px; padding: 12px; margin-top: 10px; text-align: right; }
        .user-tasks-title { font-weight: bold; color: #0d6efd; margin-bottom: 5px; font-size: 14px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 400px; max-height: 80vh; border-radius: 15px; padding: 20px; overflow-y: auto; text-align: right; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
        .close-modal-btn { position: absolute; top: 10px; left: 10px; background: #e4e6eb; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; font-weight: bold; color: #333; line-height: 30px; padding: 0; text-align: center; }
        .tech-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .tech-name { font-weight: bold; color: #1a73e8; margin-bottom: 3px; }
    </style>
	<link rel="icon" type="image/jpeg" href="icon.jpeg">
	<link rel="apple-touch-icon" href="icon.jpeg">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="משמרות">
</head>
<body>

<div class="container">
    <h2>המשמרות שלי</h2>
    <div class="form-group">
        <label>בחר משתמש:</label>
        <select id="userSelector" onchange="switchUser(this.value)">
            <option value="אבא">אבא</option>
            <option value="יאיר">יאיר</option>
            <option value="עמיחי">עמיחי</option>
        </select>
        <div id="syncStatus" class="status-bar">בטעינה...</div>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" id="btn-entry" onclick="showTab('entry')">➕ עדכון</button>
        <button class="tab-btn" id="btn-calendar" onclick="showTab('calendar')">📅 לוח</button>
    </div>

    <div id="entry" class="view active">
		<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px;">
			<button onclick="changeDay(-1)" class="tab-btn" style="flex: 0; padding: 5px 15px;">▶</button>
			<h3 id="selectedDateTitle" style="color: #1a73e8; margin: 0; font-size: 1.1em; flex: 1; text-align: center;"></h3>
			<button onclick="changeDay(1)" class="tab-btn" style="flex: 0; padding: 5px 15px;">◀</button>
		</div>
		<input type="hidden" id="datePicker" onchange="loadShiftsForDate()">

        <div id="userDailyTasks" class="user-tasks-card">
            <div class="user-tasks-title" id="userTaskHeader">משימות עבור המשתמש:</div>
            <div id="userTaskContent" style="font-size: 14px; color: #333;">טוען...</div>
        </div>

        <div class="shift-options" style="margin-top:15px;">
            <label class="option"><input type="checkbox" name="shift" value="יום"> ☀️ יום</label>
            <label class="option"><input type="checkbox" name="shift" value="לילה"> 🌙 לילה</label>
            <label class="option"><input type="checkbox" name="shift" value="חופש"> 🏖️ חופש</label>
            <label class="option"><input type="checkbox" name="shift" value="מחלה"> 🤒 מחלה</label>
        </div>
		<div style="margin-top: 15px; margin-bottom: 15px;">
			<input type="text" id="dailyNote" placeholder="הערה יומית (אופציונלי)..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box;">
		</div>
        <button class="save-btn" onclick="saveAndSync()">💾 שמור וסנכרן</button>
        <button class="pull-btn" onclick="pullFromSheets()">🔄 רענן מהענן</button>
        
        <button class="all-tech-btn" onclick="openAllTechniciansModal()">📋 הצג את כל הטכנאים והמשימות</button>
    </div>

    <div id="calendar" class="view">
		<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
			<button onclick="changeMonth(-1)" class="tab-btn" style="flex: 0; padding: 5px 15px;">▶</button>
			<input type="month" id="monthView" onchange="renderCalendar()" style="width: 60%; margin: 0;">
			<button onclick="changeMonth(1)" class="tab-btn" style="flex: 0; padding: 5px 15px;">◀</button>
		</div>
        <div class="calendar-grid">
            <div class="day-header">א'</div><div class="day-header">ב'</div><div class="day-header">ג'</div>
            <div class="day-header">ד'</div><div class="day-header">ה'</div><div class="day-header">ו'</div><div class="day-header">ש'</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<!-- מודאל/חלונית צפה הניתנת לסגירה בקלות -->
<div id="techModal" class="modal-overlay" onclick="closeAllTechniciansModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-modal-btn" onclick="closeAllTechniciansModal()">✕</button>
        <h3 style="margin-top:0; color:#1a73e8; padding-left: 25px;" id="modalDateTitle">משימות כל הטכנאים</h3>
        <div id="modalTechList">בטעינה...</div>
        <button class="pull-btn" style="margin-top:15px; width:100%;" onclick="closeAllTechniciansModal()">סגור</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqDA5B-igoIjMx1l-LSzlefxO_VAxNSrh4O5ozN1EySsWNDmMwUcT-wn98SnTLKNp2/exec"; 
    
    let db = JSON.parse(localStorage.getItem('multiUserShifts')) || { "אבא": {}, "יאיר": {}, "עמיחי": {} };
    let currentUser = localStorage.getItem('lastUser') || "אבא";

    window.onload = function() {
        const today = new Date();
        const d = String(today.getDate()).padStart(2, '0');
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const y = today.getFullYear();
        
        document.getElementById('datePicker').value = `${y}-${m}-${d}`;
        document.getElementById('monthView').value = `${y}-${m}`;
        document.getElementById('userSelector').value = currentUser;
        
        updateDateTitle(`${y}-${m}-${d}`);
        refreshAll();
        pullFromSheets();
    };

    function switchUser(val) {
        currentUser = val;
        localStorage.setItem('lastUser', currentUser);
        refreshAll();
        pullFromSheets();
    }

    function refreshAll() {
        loadShiftsForDate();
        renderCalendar();
    }
	
	async function loadShiftsForDate() {
		const date = document.getElementById('datePicker').value;
		const userObj = db[currentUser] || {};
		let savedData = userObj[date];
		
		let regularShifts = [];
		let noteValue = "";

		if (Array.isArray(savedData)) {
			savedData.forEach(s => {
				if (typeof s === 'string' && s.startsWith("NOTE:")) {
					noteValue = s.substring(5);
				} else {
					regularShifts.push(s);
				}
			});
		} else if (savedData) {
			regularShifts = savedData.status || [];
			noteValue = savedData.note || "";
		}
		
		document.querySelectorAll('input[name="shift"]').forEach(cb => {
			cb.checked = regularShifts.includes(cb.value);
		});
		
		const noteElement = document.getElementById('dailyNote');
		if(noteElement) noteElement.value = noteValue;

		document.getElementById('userTaskHeader').innerText = `משימות עבור ${currentUser}:`;
		document.getElementById('userTaskContent').innerHTML = "טוען משימות...";

		try {
			const response = await fetch(`${WEB_APP_URL}?action=getSheet2&date=${encodeURIComponent(date)}`);
			const data = await response.json();
			
			if (data && data[currentUser]) {
				// הפיכת מספרי הטלפון לקישורים לחיצים
				document.getElementById('userTaskContent').innerHTML = makePhoneNumbersClickable(data[currentUser]);
			} else {
				updateUserTasksDisplay(regularShifts, noteValue);
			}
		} catch (e) {
			updateUserTasksDisplay(regularShifts, noteValue);
		}
	}

	function updateUserTasksDisplay(shifts, note) {
		document.getElementById('userTaskHeader').innerText = `משימות עבור ${currentUser}:`;
		let text = "";
		if (shifts.length > 0) {
			text += `<b>משמרות/סטטוס:</b> ${shifts.join(', ')}<br>`;
		}
		if (note) {
			text += `<b>הערה/משימה:</b> ${note}`;
		}
		if (!shifts.length && !note) {
			text = "אין משימות או משמרות מוגדרות ליום זה.";
		}
		document.getElementById('userTaskContent').innerHTML = text;
	}

    async function saveAndSync() {
		const date = document.getElementById('datePicker').value;
		const selected = Array.from(document.querySelectorAll('input[name="shift"]:checked')).map(cb => cb.value);
		
		const noteElement = document.getElementById('dailyNote');
		const noteText = noteElement ? noteElement.value.trim() : "";
		
		if (!db[currentUser]) db[currentUser] = {};
		
		db[currentUser][date] = {
			status: selected,
			note: noteText
		};
		
		localStorage.setItem('multiUserShifts', JSON.stringify(db));
		renderCalendar();
        updateUserTasksDisplay(selected, noteText);
		
		document.getElementById('syncStatus').innerText = "מסנכרן לענן...";
		try {
			await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(db) });
			document.getElementById('syncStatus').innerText = "סונכרן: " + currentUser;
		} catch (e) {
			document.getElementById('syncStatus').innerText = "נשמר מקומית בלבד";
		}
	}

    async function pullFromSheets() {
		try {
			document.getElementById('syncStatus').innerText = "מעדכן מהענן...";
			const response = await fetch(WEB_APP_URL);
			const dataByDate = await response.json(); 
			
			let newDb = {};
			
			const fixDate = (d) => {
				if (!d) return "";
				const dateObj = new Date(d);
				if (!isNaN(dateObj.getTime())) {
					return dateObj.toISOString().split('T')[0];
				}
				return d.toString().substring(0, 10);
			};

			for (let dateKey in dataByDate) {
				const cleanDate = fixDate(dateKey);
				
				for (let user in dataByDate[dateKey]) {
					const u = user.trim();
					if (!newDb[u]) {
						newDb[u] = {};
					}
					newDb[u][cleanDate] = dataByDate[dateKey][user];
				}
			}
			
			db = newDb;
			localStorage.setItem('multiUserShifts', JSON.stringify(db));
			document.getElementById('syncStatus').innerText = "סונכרן: " + currentUser;
			
			loadShiftsForDate();
			renderCalendar();
			
		} catch (e) {
			console.error("Pull error:", e);
			document.getElementById('syncStatus').innerText = "שגיאה בעיבוד נתונים";
			renderCalendar();
		}
	}

    // שליפת נתונים מרוכזת ומעובדת רק ליום הנוכחי
    async function openAllTechniciansModal() {
		const currentDate = document.getElementById('datePicker').value;
		document.getElementById('modalDateTitle').innerText = `משימות טכנאים - ${currentDate}`;
		document.getElementById('modalTechList').innerHTML = "טוען נתונים...";
		document.getElementById('techModal').style.display = 'flex';

		try {
			const fetchUrl = `${WEB_APP_URL}?action=getSheet2&date=${encodeURIComponent(currentDate)}`;
			const response = await fetch(fetchUrl);
			const data = await response.json();
			
			let html = "";
			
			// בדיקה אם קיבלנו תשובה מגיליון 2 (מילון שטוח של שם-טכנאי => משימה)
			const firstKey = Object.keys(data)[0];
			const isSheet2Format = firstKey && typeof data[firstKey] === 'string';

			if (isSheet2Format) {
				for (let tech in data) {
					let taskText = data[tech] || 'אין משימות מוגדרות';
					html += `<div class="tech-item">
						<div class="tech-name">${tech}</div>
						<div>${makePhoneNumbersClickable(taskText)}</div>
					</div>`;
				}
			} else {
				// אם השרת החזיר בטעות את גיליון 1, נציג רק את התאריך הספציפי שנבחר בלבד!
				const targetDayData = data[currentDate];
				
				if (targetDayData) {
					for (let user in targetDayData) {
						let uName = user;
						let uData = targetDayData[user];
						let shifts = (uData.status && Array.isArray(uData.status)) ? uData.status.join(', ') : '';
						let note = uData.note || '';
						let combined = [shifts, note].filter(Boolean).join(' - ');
						
						let taskText = data[tech] || 'אין משימות מוגדרות';
						html += `<div class="tech-item">
							<div class="tech-name">${tech}</div>
							<div>${makePhoneNumbersClickable(taskText)}</div>
						</div>`;
					}
				} else {
					html = "<div style='padding:15px; color:#666;'>אין משימות רשומות לתאריך זה.</div>";
				}
			}
			
			document.getElementById('modalTechList').innerHTML = html;
		} catch (e) {
			document.getElementById('modalTechList').innerHTML = "שגיאה בטעינת נתונים";
		}
	}

    function closeAllTechniciansModal() {
        document.getElementById('techModal').style.display = 'none';
    }

    function showTab(tabId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (tabId === 'entry') document.getElementById('btn-entry').classList.add('active');
        else {
            document.getElementById('btn-calendar').classList.add('active');
            renderCalendar();
        }
    }

	function updateDateTitle(dateStr) {
		const dateObj = new Date(dateStr);
		const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
		document.getElementById('selectedDateTitle').innerText = dateObj.toLocaleDateString('he-IL', options);
	}
	
	function changeDay(diff) {
		const currentPicker = document.getElementById('datePicker');
		const currentDate = new Date(currentPicker.value);
		
		currentDate.setDate(currentDate.getDate() + diff);
		
		const newDateStr = currentDate.toISOString().split('T')[0];
		
		currentPicker.value = newDateStr;
		updateDateTitle(newDateStr);
		loadShiftsForDate();
	}

	function changeMonth(diff) {
		const monthInput = document.getElementById('monthView');
		const [year, month] = monthInput.value.split('-').map(Number);
		const date = new Date(year, month - 1 + diff, 1);
		
		const newY = date.getFullYear();
		const newM = String(date.getMonth() + 1).padStart(2, '0');
		monthInput.value = `${newY}-${newM}`;
		renderCalendar();
	}

	function renderCalendar() {
		const monthVal = document.getElementById('monthView').value;
		if (!monthVal) return;
		const [year, month] = monthVal.split('-');
		
		const firstDay = new Date(year, month - 1, 1).getDay();
		const daysInMonth = new Date(year, month, 0).getDate();
		const grid = document.getElementById('calendarGrid');
		grid.innerHTML = '';
		
		for (let e = 0; e < firstDay; e++) {
			grid.innerHTML += `<div class="day-cell" style="visibility:hidden"></div>`;
		}
		
		const userShifts = db[currentUser] || {};
		const today = new Date().toISOString().split('T')[0];

		for (let i = 1; i <= daysInMonth; i++) {
			const dStr = `${year}-${month}-${String(i).padStart(2, '0')}`;
			let savedData = userShifts[dStr];
			const isToday = dStr === today ? 'today' : '';
			
			let shifts = [];
			let noteText = "";

			if (Array.isArray(savedData)) {
				shifts = savedData.filter(s => typeof s !== 'string' || !s.startsWith("NOTE:"));
				let noteObj = savedData.find(s => typeof s === 'string' && s.startsWith("NOTE:"));
				if (noteObj) noteText = noteObj.substring(5);
			} else if (savedData) {
				shifts = savedData.status || [];
				noteText = savedData.note || "";
			}

			let tags = shifts.map(s => `<span class="shift-tag tag-${s}">${s}</span>`).join('');
			
			if (noteText) {
				tags += `<span class="shift-tag tag-note" title="${noteText}">📝 ${noteText}</span>`;
			}
			
			const cell = document.createElement('div');
			cell.className = `day-cell ${isToday}`;
			cell.style.cursor = 'pointer';
			cell.innerHTML = `<span class="day-num">${i}</span>${tags}`;
			cell.onclick = () => selectDateFromCalendar(dStr);
			grid.appendChild(cell);
		}
	}

	function selectDateFromCalendar(dateStr) {
		document.getElementById('datePicker').value = dateStr;
		updateDateTitle(dateStr);
		loadShiftsForDate();
		showTab('entry');
	}
	
	function makePhoneNumbersClickable(text) {
		if (!text) return "";
		
		// ביטוי רגולרי מעודכן המזהה ניידים/נייחים (עם/בלי מקפים, וגם עם רווחים)
		// מזהה פורמטים כגון: 0522388777, 052-2388777, 052 2388777, 026543210 וכדומה
		const phoneRegex = /(?:0[23489]|05[0-9])[\s-]?\d{3}[\s-]?\d{4}|\b05\d{8}\b|\b0[23489]\d{7}\b/g;
		
		return text.replace(phoneRegex, function(phone) {
			// ניקוי תווים שאינם ספרות כדי לבנות קישור tel: תקין לחיוג
			const cleanNumber = phone.replace(/\D/g, '');
			return `<a href="tel:${cleanNumber}" style="color: #1a73e8; font-weight: bold; text-decoration: underline; dir: ltr; display: inline-block;">${phone}</a>`;
		});
	}
</script>
</body>
</html>
